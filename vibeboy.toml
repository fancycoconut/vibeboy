[display]
# Integer scale factor applied to the 160x144 Game Boy screen.
scale = 3
# How DMG (non-GBC) ROMs are rendered: "color" (GBC-style colorization) or "grey" (original tones).
dmg_mode = "color"
# Palette used in "color" mode: "auto" (GBC boot ROM title-hash) | "green" | "grey".
dmg_palette = "grey"

[keybindings]
# SDL2 keycode names — see https://docs.rs/sdl2/latest/sdl2/keyboard/enum.Keycode.html
right  = "Right"
left   = "Left"
up     = "Up"
down   = "Down"
a      = "Z"
b      = "X"
start  = "Return"
select = "Space"
quit   = "Escape"
